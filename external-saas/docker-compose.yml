services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: nextdue
      POSTGRES_USER: nextdue
      POSTGRES_PASSWORD: nextdue
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nextdue -d nextdue"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - nextdue-postgres:/var/lib/postgresql/data

  migrate:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgres://nextdue:nextdue@postgres:5432/nextdue
    command: ["npm", "run", "db:migrate"]
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgres://nextdue:nextdue@postgres:5432/nextdue
      APP_URL: http://localhost:3000
      AUTH_TRUST_HOST: "true"
    ports:
      - "3000:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  nextdue-postgres:
